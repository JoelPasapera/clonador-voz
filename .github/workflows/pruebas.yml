name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # la versión de Python que usa Colab

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy pytest

      - name: Código fuente de las librerías en las versiones que fija la celda 1
        run: |
          coqui=$(python pruebas/version_fijada.py VERSION_COQUI_TTS)
          whisper=$(python pruebas/version_fijada.py VERSION_FASTER_WHISPER)
          chatterbox=$(python pruebas/version_fijada.py VERSION_CHATTERBOX)
          echo "coqui-tts $coqui · faster-whisper $whisper · chatterbox-tts $chatterbox"
          git clone --quiet --depth 1 --branch "v$coqui" https://github.com/idiap/coqui-ai-TTS "$RUNNER_TEMP/coqui-ai-tts"
          git clone --quiet --depth 1 --branch "v$whisper" https://github.com/SYSTRAN/faster-whisper "$RUNNER_TEMP/faster-whisper"
          # chatterbox-tts no etiqueta sus versiones en GitHub: este es el commit publicado en PyPI como 0.1.7.
          # Si cambias VERSION_CHATTERBOX, actualiza también este commit (test_fidelidad compara las versiones).
          git init --quiet "$RUNNER_TEMP/chatterbox"
          git -C "$RUNNER_TEMP/chatterbox" fetch --quiet --depth 1 https://github.com/resemble-ai/chatterbox 59bc590b3cad826e5d5987745bf6844627a21ad5
          git -C "$RUNNER_TEMP/chatterbox" checkout --quiet FETCH_HEAD

      - name: Carpeta /content, como en Colab
        run: sudo mkdir -p /content && sudo chown "$(id -u):$(id -g)" /content

      - name: Pruebas
        env:
          COQUI_TTS_SRC: ${{ runner.temp }}/coqui-ai-tts
          FASTER_WHISPER_SRC: ${{ runner.temp }}/faster-whisper
          CHATTERBOX_SRC: ${{ runner.temp }}/chatterbox
        run: python -m pytest pruebas -q
